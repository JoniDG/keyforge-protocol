name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate and generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # Provides uvx for datamodel-codegen (on Python 3.14) and Python 3.15 for
      # the package itself; uv downloads both interpreters on demand.
      - uses: astral-sh/setup-uv@v10

      - name: Install schema toolchain
        run: |
          npm install -g json-schema-to-typescript ajv-cli ajv-formats
          go install github.com/atombender/go-jsonschema@latest

      - name: Lint JSON syntax
        run: |
          for f in $(find schemas examples -name '*.json'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

      - name: Validate examples
        run: make validate

      - name: Generate types (smoke test)
        run: make generate

      - name: Check generated types are up to date
        # status, not diff: a new schema yields new files that diff ignores.
        run: |
          if [ -n "$(git status --porcelain go/ ts/src/ py/src/)" ]; then
            git status --short go/ ts/src/ py/src/
            git diff go/ ts/src/ py/src/
            exit 1
          fi

      - name: Build Go submodule
        working-directory: go
        run: go build ./...

      - name: Build TS package
        working-directory: ts
        run: |
          npm ci
          npm run build
          npm run typecheck

      - name: Check Python package
        run: make check-py

      - name: Build Python package
        run: make build-py
