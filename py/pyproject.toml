[project]
name = "jdg-keyforge-protocol"
version = "0.16.1"
description = "Python types for the KeyForge WebSocket protocol, generated from the canonical JSON Schema contracts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jonathan Daniel Gomez", email = "jonathan.d.gomez98@gmail.com" }]
requires-python = ">=3.15"
dependencies = []
keywords = ["keyforge", "protocol", "types", "json-schema", "websocket"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/JoniDG/keyforge-protocol"
Repository = "https://github.com/JoniDG/keyforge-protocol"
Issues = "https://github.com/JoniDG/keyforge-protocol/issues"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "keyforge_protocol"

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]
